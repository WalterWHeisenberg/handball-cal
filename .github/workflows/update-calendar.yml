name: Update Handball Calendar

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 ics pytz

      - name: Generate calendar file
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: python generate_calendar.py

      - name: Create .nojekyll file
        run: touch .nojekyll

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.ics .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update handball calendars"
            git push
          fi
