name: Update Handball Calendar

on:
  schedule:
    - cron: '0 0 * * *'   # Täglich um Mitternacht UTC
  workflow_dispatch:       # Manuell startbar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 ics pytz

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add handball.ics
          git diff --quiet && echo "No changes" || (git commit -m "Update calendar" && git push)
      - name: Verify handball.ics exists
        run: |
          test -f handball.ics && echo "ICS file present" || (echo "ICS file missing" && exit 1)   
