name: Update Handball Calendar

on:
  # Täglich um Mitternacht UTC automatisch ausführen
  schedule:
    - cron: '0 0 * * *'
  # Erlaubt das manuelle Starten des Workflows über die GitHub-Oberfläche
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Notwendig, um der Action zu erlauben, Änderungen in das Repository zu schreiben.
    permissions:
      contents: write

    steps:
      # Schritt 1: Das Repository in den Runner klonen
      - name: Checkout repository
        uses: actions/checkout@v5

      # Schritt 2: Python-Umgebung einrichten
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Schritt 3: Notwendige Python-Bibliotheken installieren
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 ics pytz

      # Schritt 4: Das Python-Skript ausführen, um die .ics-Datei zu erstellen
      - name: Generate calendar file
        run: python generate_calendar.py

      - name: Create .nojekyll file
        run: touch .nojekyll

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.ics .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update handball calendars"
            git push
          fi
